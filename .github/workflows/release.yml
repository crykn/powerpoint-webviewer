name: Release

# Push a tag like v1.4.0 to publish a release with manifest.xml attached.
# The README links to releases/latest/download/manifest.xml, which always
# downloads the file from the newest release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish release with manifest.xml
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" manifest.xml --title "$GITHUB_REF_NAME" --generate-notes
